name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Check for sources
        id: sources
        run: |
          if ls sources/*.glyphs sources/*.glyphspackage >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Glyphs source yet; skipping build."
          fi
      - name: Build fonts
        if: steps.sources.outputs.found == 'true'
        run: make build PYTHON=python3
      - name: Fontbakery
        if: steps.sources.outputs.found == 'true'
        run: make test PYTHON=python3
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: steps.sources.outputs.found == 'true'
        with:
          name: fonts
          path: |
            fonts
            out/fontbakery
