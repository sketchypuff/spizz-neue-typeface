name: Build and test

on:
  push:
    branches: [main]
    tags: ["v*"]   # pushing a tag like v0.1 also publishes a GitHub Release
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to create releases
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Check for sources
        id: sources
        run: |
          shopt -s nullglob
          srcs=(sources/*.glyphs sources/*.glyphspackage)
          if (( ${#srcs[@]} )); then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Glyphs source yet; skipping build."
          fi
      - name: Build fonts
        if: steps.sources.outputs.found == 'true'
        run: make build PYTHON=python3
      - name: Fontbakery
        if: steps.sources.outputs.found == 'true'
        run: make test PYTHON=python3
        continue-on-error: true
      - uses: actions/upload-artifact@v5
        if: steps.sources.outputs.found == 'true'
        with:
          name: fonts
          path: |
            fonts
            out/fontbakery
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') && steps.sources.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          zip -r "SpizzNeue-$TAG.zip" fonts README.md
          # v0.x versions are marked as pre-releases
          pre=""; [[ "$TAG" == v0* ]] && pre="--prerelease"
          gh release create "$TAG" "SpizzNeue-$TAG.zip" \
            --title "Spizz Neue $TAG" --generate-notes $pre
